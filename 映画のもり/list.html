<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アンケート結果</title>
</head>
<body>
  <h1>みんなのおすすめ映画ランキング</h1>
 
  <div id="ranking"></div>


  <h2>みんなのおすすめ映画</h2>

  <div id="list"></div>

  <script>

  const data = JSON.parse(localStorage.getItem("survey")) || [];
 
const counts = {};
 
data.forEach(item => {
 
const movie = (item.movie || "").trim();
 
if (!movie) return;
 
if (!counts[movie]) {
counts[movie] = 0;
}
 
counts[movie]++;
 
});

// 総投票数
const totalVotes = Object.values(counts)
.reduce((sum, count) => sum + count, 0);

// ランキング作成
const ranking = Object.entries(counts)
.sort((a, b) => b[1] - a[1]);
 
// 表示先取得
const rankingDiv = document.getElementById("ranking");
 
// 投票なし
if (ranking.length === 0) {
rankingDiv.textContent = "まだ投票がありません";
} else {

let html = `
<p><strong>総投票数：</strong>${totalVotes}票</p>

<table border="1">
<tr>
<th>順位</th>
<th>映画名</th>
<th>票数</th>
<th>割合</th>
</tr>
`;
 
ranking.forEach(([movie, count], index) => {
const percentage =
((count / totalVotes) * 100).toFixed(1);
html += `
<tr ${
index === 0
? 'style="background:gold;"'
: ""
}>
<td>${index + 1}</td>
<td>${movie}</td>
<td>${count}</td>
<td>${percentage}%</td>
</tr>
`;
});
 
html += "</table>";
 
rankingDiv.innerHTML = html;

}

    const saved = JSON.parse(localStorage.getItem("survey")) || [];
    const currentUserId = localStorage.getItem("userId");
    const list = document.getElementById("list");

    saved.forEach((item, index)=> {
      const div = document.createElement("div");
      div.style.border = "1px solid #ccc";
      div.style.padding = "10px";
      div.style.margin = "10px 0";
      div.innerHTML = `
        <strong>名前</strong> ${item.name}<br>
        <strong>おすすめ映画</strong> ${item.movie}<br>
        <strong>おすすめ理由</strong> ${item.comment}<br>
    `;
      list.appendChild(div);
    });
       
    function deleteItem(index) {
  // �{�l�Ȃ�폜
      saved.splice(index, 1); 
      localStorage.setItem("survey", JSON.stringify(saved)); 
      location.reload(); // 
    };
  </script>
</body>
</html>
